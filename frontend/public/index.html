<!DOCTYPE html>
<html>
<head>
  <title>Unmute Voice Agent</title>
  <meta charset="utf-8" />
</head>
<body style="font-family: sans-serif; padding: 40px;">
  <h2>Unmute Voice Agent</h2>
  <button id="connectBtn">Connect & Talk</button>
  <p id="status">Not connected</p>

  <h3>Transcript</h3>
  <div id="transcript" style="
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
      max-width: 600px;
      min-height: 120px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
  "></div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    const TOKEN_ENDPOINT = "http://localhost:8081/token";

    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");

    let currentLine = { role: null, el: null };

    function appendTranscriptDelta(role, delta) {
      if (currentLine.role !== role) {
        const p = document.createElement("div");
        p.style.marginBottom = "4px";
        const label = role === "user" ? "You: " : "Agent: ";
        p.textContent = label;
        transcriptEl.appendChild(p);
        currentLine = { role, el: p };
      }
      const existing = currentLine.el.textContent;
      const needsSpace =
        existing &&
        !/\s$/.test(existing) &&
        delta &&
        !/^\s/.test(delta);
      currentLine.el.textContent += (needsSpace ? " " : "") + delta;
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    const decoder = new TextDecoder();

    document.getElementById("connectBtn").onclick = async () => {
      statusEl.textContent = "Fetching a fresh token...";
      try {
        const resp = await fetch(TOKEN_ENDPOINT);
        if (!resp.ok) {
          throw new Error(`Token endpoint returned ${resp.status}`);
        }
        const { token, room, url } = await resp.json();
        statusEl.textContent = `Connecting to room ${room}...`;

        const roomObj = new LivekitClient.Room();

        roomObj.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === "audio") {
            const el = track.attach();
            document.body.appendChild(el);
            statusEl.textContent = "Connected - agent audio attached, talk now";
          }
        });

        roomObj.on(LivekitClient.RoomEvent.DataReceived, (payload, participant, kind, topic) => {
          if (topic !== "transcript") return;
          try {
            const { role, delta } = JSON.parse(decoder.decode(payload));
            appendTranscriptDelta(role, delta);
          } catch (e) {
            console.error("Failed to parse transcript data", e);
          }
        });

        await roomObj.connect(url, token);
        await roomObj.localParticipant.setMicrophoneEnabled(true);
        statusEl.textContent = `Connected to ${room} - mic on, waiting for agent...`;
      } catch (err) {
        statusEl.textContent = "ERROR: " + err.message;
        console.error(err);
      }
    };
  </script>
</body>
</html>
